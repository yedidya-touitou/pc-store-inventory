<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי חנות מחשבים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17222d;--mute:#6b7885;--line:#d9dfe5;--acc:#0b6e69;--neg:#b3261e;--head:#dfe6ec}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2a3743;--acc:#4cc9c0;--neg:#ff8a80;--head:#1f2c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;padding:12px;max-width:900px;margin-inline:auto}
h1{font-size:1.3rem;margin:8px 0 12px;font-weight:800}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.bar input{flex:1;min-width:140px}
button{cursor:pointer;font-weight:600}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--mute)}
.sum b{display:block;font-size:1.05rem;color:var(--ink)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
section>h2{margin:0;padding:10px 12px;background:var(--head);font-size:1rem;display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.78rem}
td.n{font-variant-numeric:tabular-nums}
.pos{color:var(--acc);font-weight:600}.neg{color:var(--neg);font-weight:600}
td button{padding:4px 8px;font-size:.8rem}
.empty{padding:14px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0007}
label{display:block;font-size:.82rem;color:var(--mute);margin-top:10px}
dialog input,dialog select{width:100%;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.calc{margin-top:12px;font-size:.88rem;color:var(--mute)}
.calc b{color:var(--ink)}
</style>
</head>
<body>
<h1>מלאי חנות מחשבים</h1>
<div class="bar">
  <input id="q" placeholder="חיפוש פריט…" aria-label="חיפוש">
  <button class="pri" id="add">פריט חדש</button>
</div>
<div class="sum" id="sum"></div>
<main id="list"></main>

<dialog id="dlg">
  <form method="dialog" id="f">
    <b id="dt">פריט חדש</b>
    <label>קטגוריה<select id="cat"></select></label>
    <label>שם הפריט<input id="name" required></label>
    <div class="row">
      <label>כמות<input id="qty" type="number" min="0" step="1" value="1" required></label>
      <label>מחיר עלות (לפני מע״מ)<input id="cost" type="number" min="0" step="0.01" required></label>
    </div>
    <label>מחיר ללקוח (כולל מע״מ)<input id="price" type="number" min="0" step="0.01" required></label>
    <div class="calc" id="calc"></div>
    <div class="row" style="margin-top:14px">
      <button type="button" id="cancel">ביטול</button>
      <button class="pri" value="ok">שמירה</button>
    </div>
  </form>
</dialog>

<script>
const VAT = 0.18; // שיעור מע״מ – אפשר לשנות כאן
const CATS = ["מעבדים","לוחות אם","כרטיסי מסך","זיכרון RAM","אחסון (SSD/HDD)","ספקי כוח","מארזים","קירור","מחשבים מורכבים","אחר"];
const KEY = "pc-inventory-v1";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { items = []; }
let editId = null;
const $ = id => document.getElementById(id);
const fmt = n => "₪" + n.toLocaleString("he-IL",{minimumFractionDigits:0,maximumFractionDigits:2});
const profitUnit = i => i.price/(1+VAT) - i.cost;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} };

$("cat").innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");

function render(){
  const q = $("q").value.trim().toLowerCase();
  const shown = items.filter(i=>!q || i.name.toLowerCase().includes(q));
  const totQty = items.reduce((s,i)=>s+i.qty,0);
  const totCost = items.reduce((s,i)=>s+i.cost*i.qty,0);
  const totProfit = items.reduce((s,i)=>s+profitUnit(i)*i.qty,0);
  $("sum").innerHTML = `<div>יחידות במלאי<b>${totQty}</b></div><div>שווי עלות (לפני מע״מ)<b>${fmt(totCost)}</b></div><div>רווח צפוי (לפני מע״מ)<b>${fmt(totProfit)}</b></div>`;
  let html = "";
  for (const c of CATS) {
    const rows = shown.filter(i=>i.cat===c);
    if (!rows.length && !(c==="מעבדים" && !q)) continue;
    const cp = rows.reduce((s,i)=>s+profitUnit(i)*i.qty,0);
    html += `<section><h2><span>${c}</span><span>${rows.length} פריטים</span></h2>`;
    if (!rows.length) html += `<div class="empty">אין עדיין מעבדים. לחץ על ״פריט חדש״.</div>`;
    else html += `<div class="wrap"><table><tr><th>שם</th><th>כמות</th><th>עלות (לפני מע״מ)</th><th>ללקוח (כולל מע״מ)</th><th>רווח ליחידה</th><th>סה״כ רווח</th><th></th></tr>` +
      rows.map(i=>{const pu=profitUnit(i), t=pu*i.qty, cls=pu>=0?"pos":"neg";
        return `<tr><td>${esc(i.name)}</td><td class="n">${i.qty}</td><td class="n">${fmt(i.cost)}</td><td class="n">${fmt(i.price)}</td><td class="n ${cls}">${fmt(pu)}</td><td class="n ${cls}">${fmt(t)}</td><td><button onclick="edit('${i.id}')">עריכה</button> <button onclick="del('${i.id}')">מחיקה</button></td></tr>`}).join("") +
      `<tr><th colspan="5">סה״כ ${c}</th><th class="${cp>=0?"pos":"neg"}">${fmt(cp)}</th><th></th></tr></table></div>`;
    html += `</section>`;
  }
  $("list").innerHTML = html || `<div class="empty">לא נמצאו פריטים.</div>`;
}
const esc = s => s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function calc(){
  const c=+$("cost").value||0, p=+$("price").value||0, qn=+$("qty").value||0;
  const pu = p/(1+VAT)-c;
  $("calc").innerHTML = `מחיר ללקוח לפני מע״מ: <b>${fmt(p/(1+VAT))}</b><br>רווח ליחידה: <b>${fmt(pu)}</b> · סה״כ רווח: <b>${fmt(pu*qn)}</b>`;
}
["cost","price","qty"].forEach(id=>$(id).addEventListener("input",calc));
$("q").addEventListener("input",render);

function openDlg(i){
  editId = i ? i.id : null;
  $("dt").textContent = i ? "עריכת פריט" : "פריט חדש";
  $("cat").value = i ? i.cat : "מעבדים";
  $("name").value = i ? i.name : "";
  $("qty").value = i ? i.qty : 1;
  $("cost").value = i ? i.cost : "";
  $("price").value = i ? i.price : "";
  calc(); $("dlg").showModal();
}
window.edit = id => openDlg(items.find(i=>i.id===id));
window.del = id => { if(confirm("למחוק את הפריט?")){ items = items.filter(i=>i.id!==id); save(); render(); } };
$("add").onclick = () => openDlg(null);
$("cancel").onclick = () => $("dlg").close();
$("f").addEventListener("submit", e => {
  if (e.submitter && e.submitter.value !== "ok") return;
  const d = {cat:$("cat").value,name:$("name").value.trim(),qty:+$("qty").value,cost:+$("cost").value,price:+$("price").value};
  if (editId) Object.assign(items.find(i=>i.id===editId), d);
  else items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ...d});
  save(); render();
});
render();
</script>
</body>
</html>
