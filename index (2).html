<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי חנות מחשבים</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e69">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17222d;--mute:#6b7885;--line:#d9dfe5;--acc:#0b6e69;--neg:#b3261e;--head:#dfe6ec}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2a3743;--acc:#4cc9c0;--neg:#ff8a80;--head:#1f2c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;padding:12px;max-width:900px;margin-inline:auto}
h1{font-size:1.3rem;margin:8px 0 12px;font-weight:800}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.bar input{flex:1;min-width:140px}
button{cursor:pointer;font-weight:600}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.btn{cursor:pointer;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:inline-block;user-select:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:11px;font-size:1rem}.tabs button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--mute)}
.sum b{display:block;font-size:1.05rem;color:var(--ink)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
section>h2{margin:0;padding:10px 12px;background:var(--head);font-size:1rem;display:flex;justify-content:space-between}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.78rem}
td.n{font-variant-numeric:tabular-nums}
.pos{color:var(--acc);font-weight:600}.neg{color:var(--neg);font-weight:600}
td button{padding:4px 8px;font-size:.8rem}
.empty{padding:14px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0007}
label{display:block;font-size:.82rem;color:var(--mute);margin-top:10px}
dialog input,dialog select{width:100%;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.calc{margin-top:12px;font-size:.88rem;color:var(--mute)}
.calc b{color:var(--ink)}
</style>
</head>
<body>
<h1>מלאי חנות מחשבים <small style="font-size:.6rem;color:var(--mute);font-weight:400">v4</small></h1>
<div class="tabs" role="tablist"><button role="tab" id="t0">ניידים</button><button role="tab" id="t1">נייחים</button></div>
<div class="bar">
  <input id="q" placeholder="חיפוש פריט…" aria-label="חיפוש">
  <button id="scan" type="button">📷 מדבקת מחיר</button>
  <button class="pri" id="add">פריט חדש</button>
  <input type="file" id="cam" accept="image/*" capture="environment" class="vh">
  <label for="gal" class="btn">🖼️ מהגלריה</label>
  <input type="file" id="gal" accept="image/*" class="vh">
</div>
<div class="sum" id="sum"></div>
<main id="list"></main>

<dialog id="dlg">
  <form method="dialog" id="f">
    <b id="dt">פריט חדש</b>
    <div class="calc" id="ocrmsg" hidden></div>
    <details id="rawd" hidden><summary style="font-size:.8rem;color:var(--mute);cursor:pointer">הטקסט שנקרא מהמדבקה</summary><pre id="raw" style="white-space:pre-wrap;font-size:.78rem;direction:auto;margin:6px 0 0"></pre></details>
    <div class="row"><label>סוג<select id="type"></select></label><label>מעבד<select id="cpu"></select></label></div>
    <label>שם הפריט<input id="name" required></label>
    <div class="row">
      <label>כמות<input id="qty" type="number" min="0" step="1" value="1" required></label>
      <label>מחיר עלות (לפני מע״מ)<input id="cost" type="number" min="0" step="0.01" required></label>
    </div>
    <label>מחיר ללקוח (כולל מע״מ)<input id="price" type="number" min="0" step="0.01" required></label>
    <div class="calc" id="calc"></div>
    <div class="row" style="margin-top:14px">
      <button type="button" id="cancel">ביטול</button>
      <button class="pri" value="ok">שמירה</button>
    </div>
  </form>
</dialog>

<dialog id="camdlg">
  <video id="vid" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000"></video>
  <div class="row" style="margin-top:10px">
    <button type="button" id="camcancel">ביטול</button>
    <button type="button" class="pri" id="snap">צלם</button>
  </div>
</dialog>

<script>
const VAT = 0.18; // שיעור מע״מ – אפשר לשנות כאן
const TYPES = ["ניידים","נייחים"];
const CPUS = ["I3","I5","I7","I9"];
const KEY = "pc-inventory-v2", TABKEY = "pc-inventory-tab";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { items = []; }
let tab = 0;
try { tab = +localStorage.getItem(TABKEY) || 0; } catch(e) {}
let editId = null;
const $ = id => document.getElementById(id);
const fmt = n => "₪" + n.toLocaleString("he-IL",{minimumFractionDigits:0,maximumFractionDigits:2});
const profitUnit = i => i.price/(1+VAT) - i.cost;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} };

$("type").innerHTML = TYPES.map((c,i)=>`<option value="${i}">${c}</option>`).join("");
$("cpu").innerHTML = CPUS.map(c=>`<option>${c}</option>`).join("");
TYPES.forEach((_,i)=>$("t"+i).onclick=()=>{ tab=i; try{localStorage.setItem(TABKEY,i);}catch(e){} render(); });

function render(){
  TYPES.forEach((_,i)=>$("t"+i).setAttribute("aria-selected", i===tab));
  const q = $("q").value.trim().toLowerCase();
  const cur = items.filter(i=>i.type===tab);
  const shown = cur.filter(i=>!q || i.name.toLowerCase().includes(q));
  const totQty = cur.reduce((s,i)=>s+i.qty,0);
  const totCost = cur.reduce((s,i)=>s+i.cost*i.qty,0);
  const totProfit = cur.reduce((s,i)=>s+profitUnit(i)*i.qty,0);
  $("sum").innerHTML = `<div>יחידות במלאי<b>${totQty}</b></div><div>שווי עלות (לפני מע״מ)<b>${fmt(totCost)}</b></div><div>רווח צפוי (לפני מע״מ)<b>${fmt(totProfit)}</b></div>`;
  let html = "";
  for (const c of CPUS) {
    const rows = shown.filter(i=>i.cpu===c);
    if (!rows.length && q) continue;
    const cp = rows.reduce((s,i)=>s+profitUnit(i)*i.qty,0);
    html += `<section><h2><span>${c}</span><span>${rows.length} פריטים</span></h2>`;
    if (!rows.length) html += `<div class="empty">אין עדיין מחשבים ${c} ב${TYPES[tab]}.</div>`;
    else html += `<div class="wrap"><table><tr><th>שם / דגם</th><th>כמות</th><th>עלות (לפני מע״מ)</th><th>ללקוח (כולל מע״מ)</th><th>רווח ליחידה</th><th>סה״כ רווח</th><th></th></tr>` +
      rows.map(i=>{const pu=profitUnit(i), t=pu*i.qty, cls=pu>=0?"pos":"neg";
        return `<tr><td>${esc(i.name)}</td><td class="n">${i.qty}</td><td class="n">${fmt(i.cost)}</td><td class="n">${fmt(i.price)}</td><td class="n ${cls}">${fmt(pu)}</td><td class="n ${cls}">${fmt(t)}</td><td><button onclick="edit('${i.id}')">עריכה</button> <button onclick="del('${i.id}')">מחיקה</button></td></tr>`}).join("") +
      `<tr><th colspan="5">סה״כ ${c}</th><th class="${cp>=0?"pos":"neg"}">${fmt(cp)}</th><th></th></tr></table></div>`;
    html += `</section>`;
  }
  $("list").innerHTML = html || `<div class="empty">לא נמצאו פריטים.</div>`;
}
const esc = s => s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function calc(){
  const c=+$("cost").value||0, p=+$("price").value||0, qn=+$("qty").value||0;
  const pu = p/(1+VAT)-c;
  $("calc").innerHTML = `מחיר ללקוח לפני מע״מ: <b>${fmt(p/(1+VAT))}</b><br>רווח ליחידה: <b>${fmt(pu)}</b> · סה״כ רווח: <b>${fmt(pu*qn)}</b>`;
}
["cost","price","qty"].forEach(id=>$(id).addEventListener("input",calc));
$("q").addEventListener("input",render);

function openDlg(i){
  editId = i ? i.id : null;
  $("dt").textContent = i ? "עריכת פריט" : "פריט חדש";
  $("type").value = i ? i.type : tab;
  $("cpu").value = i ? i.cpu : "I5";
  $("name").value = i ? i.name : "";
  $("qty").value = i ? i.qty : 1;
  $("cost").value = i ? i.cost : "";
  $("price").value = i ? i.price : "";
  $("ocrmsg").hidden=true; $("rawd").hidden=true;
  calc(); $("dlg").showModal();
}
window.edit = id => openDlg(items.find(i=>i.id===id));
window.del = id => { if(confirm("למחוק את הפריט?")){ items = items.filter(i=>i.id!==id); save(); render(); } };
$("add").onclick = () => openDlg(null);
$("cancel").onclick = () => $("dlg").close();
$("f").addEventListener("submit", e => {
  if (e.submitter && e.submitter.value !== "ok") return;
  const d = {type:+$("type").value,cpu:$("cpu").value,name:$("name").value.trim(),qty:+$("qty").value,cost:+$("cost").value,price:+$("price").value};
  if (editId) Object.assign(items.find(i=>i.id===editId), d);
  else items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ...d});
  tab = d.type; try{localStorage.setItem(TABKEY,tab);}catch(e){}
  save(); render();
});

// ===== סריקת מדבקת מחיר =====
let tessLoad;
function loadTess(){
  if (window.Tesseract) return Promise.resolve();
  return tessLoad || (tessLoad = new Promise((ok,bad)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=ok; s.onerror=()=>{tessLoad=null;bad(new Error("load"));};
    document.head.appendChild(s);
  }));
}
function shrink(file){
  return new Promise(res=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{const m=1800,k=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;
      const g=c.getContext("2d");g.filter="grayscale(1) contrast(1.3)";g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(res,"image/jpeg",.9);};
    img.src=u;
  });
}
function parseSticker(text){
  const out={};
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const m=text.match(/\bi\s?-?\s?([3579])(?!\d{0,1}\b(?![-\d]))/i)||text.match(/\bi\s?-?\s?([3579])/i);
  if(m) out.cpu="I"+m[1];
  if(/נייד|laptop|notebook|ultrabook/i.test(text)) out.type=0;
  else if(/נייח|desktop|tower|מארז/i.test(text)) out.type=1;
  // מחיר: מספר ליד ₪ / ש"ח, אחרת המספר הגדול והסביר ביותר
  const num=s=>+s.replace(/[,\s]/g,"");
  let price=null, mm;
  const near=/(?:₪|ש["״']?ח|שח)\s*(\d{1,3}(?:[,.]\d{3})+|\d{3,6})|(\d{1,3}(?:[,.]\d{3})+|\d{3,6})\s*(?:₪|ש["״']?ח|שח)/g;
  const cands=[];
  while((mm=near.exec(text))) cands.push(num((mm[1]||mm[2]).replace(".",",")));
  const good=cands.filter(n=>n>=300&&n<=60000);
  if(good.length) price=Math.max(...good);
  else{
    const all=(text.match(/\d{1,3}(?:,\d{3})+|\d{4,5}/g)||[]).map(num).filter(n=>n>=1000&&n<=60000);
    if(all.length) price=Math.max(...all);
  }
  if(price) out.price=price;
  const brand=lines.find(l=>/hp|dell|lenovo|asus|acer|msi|apple|samsung|gigabyte|huawei/i.test(l)&&/[A-Za-z]{2}/.test(l));
  const first=lines.find(l=>/[A-Za-z\u0590-\u05FF]{3}/.test(l));
  out.name=(brand||first||"").replace(/\s+/g," ").slice(0,70);
  return out;
}
const onPick=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) processImage(f); };
async function processImage(f){
  openDlg(null);
  const msg=$("ocrmsg"); msg.hidden=false; msg.textContent="קורא את המדבקה… (בפעם הראשונה זה לוקח כמה שניות)";
  try{
    await loadTess();
    const img=await shrink(f);
    const r=await Tesseract.recognize(img,"heb+eng");
    const text=r.data.text||"";
    const d=parseSticker(text);
    if(d.type!==undefined) $("type").value=d.type;
    if(d.cpu) $("cpu").value=d.cpu;
    if(d.name) $("name").value=d.name;
    if(d.price) $("price").value=d.price;
    calc();
    $("raw").textContent=text.trim()||"(לא זוהה טקסט)"; $("rawd").hidden=false;
    msg.textContent=(d.price||d.cpu||d.name)?"המדבקה נקראה. בדוק שהפרטים נכונים והשלם מחיר עלות.":"לא הצלחתי לזהות פרטים. נסה לצלם קרוב יותר ובאור טוב, או מלא ידנית.";
  }catch(err){
    msg.textContent="הסריקה נכשלה (צריך חיבור לאינטרנט). אפשר למלא ידנית.";
  }
}

// מצלמה חיה בתוך האפליקציה
let stream=null;
function stopCam(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} }
$("camdlg").addEventListener("close",stopCam);
$("camcancel").onclick=()=>$("camdlg").close();
$("scan").onclick=async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $("cam").click(); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920}},audio:false});
    $("vid").srcObject=stream; $("camdlg").showModal();
  }catch(err){
    stopCam();
    alert("לא הצלחתי לפתוח את המצלמה ("+(err&&err.name||"שגיאה")+"). בדוק שנתת לדפדפן הרשאה למצלמה, או השתמש בכפתור 'מהגלריה'.");
    $("cam").click();
  }
};
$("snap").onclick=()=>{
  const v=$("vid"); if(!v.videoWidth) return;
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  c.toBlob(b=>{ $("camdlg").close(); processImage(b); },"image/jpeg",.92);
};
$("cam").addEventListener("change",onPick);
$("gal").addEventListener("change",onPick);
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
